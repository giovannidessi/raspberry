services:
  carhunt:
    build: .
    image: carhunt:latest
    container_name: carhunt
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Europe/Rome}
      CARHUNT_DB: /data/carhunt.sqlite3
    ports:
      - "${CARHUNT_PORT:-8080}:8000"
    volumes:
      - carhunt-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  carhunt-data:
